<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="author" content="Prechan">

        <title>Leaflet.Resizer</title>

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
        <link rel="stylesheet" href="../dist/leaflet.resizer.min.css"/>

        <style>
            #map {
                width: 50vw;
                height: 50vh;
            }
        </style>
    </head>
    <body>
        <p><a href="https://github.com/Prechan/Leaflet.Resizer">Leaflet.Resizer Demo</a></p>
        <div id="map"></div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="../dist/leaflet.resizer.min.js"></script>
        <script>
            var map = L.map('map').locate({
                setView: true
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            L.resizer().addTo(map);
        </script>
    </body>
</html>
